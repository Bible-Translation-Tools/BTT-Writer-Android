buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
    }
}

plugins {
    id "com.android.application"
    id "com.getkeepsafe.dexcount" version "4.0.0"
    id 'kotlin-android'
}

android {
    namespace 'com.door43.translationstudio'
    signingConfigs {
        if (project.hasProperty('signIt')) {
            release {
                storeFile rootProject.file('bttkey.jks')
                storePassword System.getenv("KEYSTORE_PASS")
                keyAlias System.getenv("ALIAS_NAME")
                keyPassword System.getenv("ALIAS_PASS")
                v2SigningEnabled true
            }
        }
    }
    defaultConfig {
        applicationId "org.bibletranslationtools.writer.android"
        minSdk 22
        compileSdk 35
        targetSdk 35
        versionCode 40
        versionName "1.5.4"

        testBuildType "verify"
        testInstrumentationRunner "com.door43.translationstudio.CustomTestRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            testProguardFile('proguard-rules.pro')
            if (project.hasProperty('signIt')) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
        verify {
            initWith debug
            applicationIdSuffix = ".test"
        }
        applicationVariants.all { variant ->
            if (variant.buildType.name == "release") {
                variant.outputs.all {
                    outputFileName = "release.apk"
                }
            } else {
                variant.mergeResourcesProvider.configure { mergeTask ->
                    mergeTask.dependsOn tasks.named("copyDebugGithubToken")
                }
            }
        }
    }
    packagingOptions {
        resources {
            merges += ['plugin.properties']
            excludes += "/META-INF/*"
        }
    }
    lint {
        abortOnError false
        disable 'MissingTranslation', 'ExtraTranslation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    testOptions {
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
        unitTests.includeAndroidResources = true
        unitTests.returnDefaultValues = true
        animationsDisabled = true
    }
}

configurations {
    configureEach {
        exclude module: 'httpclient'
        exclude module: 'commons-logging'
    }
    cleanedAnnotations
    compile.exclude group: 'org.jetbrains' , module:'annotations'
}

